<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ចូលគណនី</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
     margin:0;
  padding:10px;
  font-family:Arial,khmer os bokor;
  background:#f5f5f5;
}

/* background circles */
.circle{
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.5;
    animation: float 6s infinite alternate;
}


@keyframes float{
    from{transform:translateY(0px);}
    to{transform:translateY(30px);}
}

/* login box */
.box{
    position:relative;
    width:320px;
    padding:25px;
    border-radius:15px;
   background:linear-gradient(135deg,#026469,#698e91);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    color:rgb(215, 232, 243);
    text-align:center;
}

h2{margin-bottom:15px;}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background-color: #ffffff;
    color: rgb(51, 50, 50);
}

.input-group{
  margin-bottom:14px;
  font-size: 16px;
}
.input-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
  color:#333;
}
.input-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
  color:#333;
}

.input-group input,
.input-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  font-family:"Khmer OS Battambang";
  outline:none;
  transition:.2s;
  box-sizing:border-box;
}

.input-group input:focus,
.input-group textarea:focus{
  border-color:#0d98be;
  box-shadow:0 0 8px rgba(211, 214, 7, 0.841);
}
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
  background:#1aa4bd;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{background:#394662;}
button:disabled{background:gray;}

/* =========================
   TOP RIGHT MESSAGE
========================= */
.msg{
    position:fixed;
    top:20px;
    right:20px;
    padding:12px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:bold;
    color:white;
    z-index:9999;
    opacity:0;
    transform:translateY(-10px);
    transition:0.3s;
    pointer-events:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.msg.show{
    opacity:1;
    transform:translateY(0);
}

.success{background:#16a34a;}
.error{background:#dc2626;}

/* =========================
   LOADING
========================= */
.loading{
    display:none;
    margin-top:10px;
    text-align:center;
}

.spinner{
    width:22px;
    height:22px;
    border:3px solid rgb(237, 244, 246);
    border-top:3px solid transparent;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

.loading-text{
    margin-top:6px;
    font-size:13px;
}

@keyframes spin{
    from{transform:rotate(0);}
    to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- background -->

<!-- MESSAGE -->
<div id="msg" class="msg"></div>

<!-- LOGIN BOX -->
<div class="box">
    <h2>ប្រពន្ថ័គ្រប់គ្រងភ្ញៀវ</h2>
<div class="input-group">
 <input id="username" placeholder="ឈ្មោះគណនី">
    <input id="password" type="password" placeholder="ពាក្យសម្ងាត់">
</div>
   

    <button id="loginBtn" style="font-family: khmer os;font-size:16px;">ចូល</button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">កំពុងដំណើរការ...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyBuKVB0z6NVtepmjE33qXxrxs8RcmCOwd0",
  authDomain:"create-db14a.firebaseapp.com",
  projectId:"create-db14a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* UI */
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");
const loading = document.getElementById("loading");

/* message function */
function showMsg(text,type){
    msg.innerText = text;
    msg.className = "msg " + type + " show";

    setTimeout(()=>{
        msg.className = "msg";
    },3000);
}

/* LOGIN */
btn.addEventListener("click", async ()=>{

    let u = document.getElementById("username").value.trim();
    let p = document.getElementById("password").value.trim();

    if(!u || !p){
        showMsg("⚠️ សូមបំពេញ គណនីអោយត្រឹមត្រូវ","error");
        return;
    }

    loading.style.display="block";
    btn.disabled=true;

    try{

        const q = query(
            collection(db,"users"),
            where("username","==",u),
            where("password","==",p)
        );

        const snap = await getDocs(q);

        if(snap.empty){
            showMsg("❌ បរាជ័យ","error");

            loading.style.display="none";
            btn.disabled=false;
            return;
        }

        snap.forEach(doc=>{
            localStorage.setItem("user",JSON.stringify(doc.data()));
        });

        showMsg("✅ ចូល បានជោគជ័យ!!","success");

        setTimeout(()=>{
            window.location.href="index.html";
        },1200);

    }catch(e){
        showMsg("❌ Error: "+e.message,"error");
    }

    loading.style.display="none";
    btn.disabled=false;
});


document.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
        btn.click();
    }
});
</script>

</body>
</html>
